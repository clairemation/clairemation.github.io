<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
      body {
        background: #000;
      }
      #content {
        width: 100%;
        display: flex;
        align-items: center;
        align-content: center;
        justify-content: center;
        flex-wrap: nowrap;
        flex-direction: row;
      }

      img {
        max-width: 100%;
        max-height: 100%;
      }
    </style>

</head>
<body>
<div id="content"></div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search)
    const imageName = params.get("imageName")
    const image = new Image()
    //TODO: sanitize input
    image.src = `scaled/${imageName}`
    document.querySelector("#content").appendChild(image)

    resize()
  })

  var timeout

  window.addEventListener("resize", () => {
    clearTimeout(timeout)
    timeout = setTimeout(resize, 100)
  })

  function resize()
  {
    document.querySelector("#content").style.height = `${window.innerHeight}px`;
  }
</script>
</body>
</html>
